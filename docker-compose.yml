services:
  datedrop:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${DATEDROP_PORT:-8080}:4000"
    volumes:
      - datedrop-data:/app/data
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  datedrop-data:
